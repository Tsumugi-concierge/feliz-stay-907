<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Shops - Feliz Stay 907</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style-sub.css?v=header-bands-20260528">
  <link rel="stylesheet" href="../assets/cute-pack.css">
  <style id="cute-pack-theme">:root{--cp-chip-a:#fff3e8;--cp-chip-b:#fdeef4;--cp-hover-shadow:rgba(220,140,90,.18);--cp-dot-1:rgba(240,170,120,.10);}</style>
  <style>
    :root { --accent:#f0824a; --accent-light:#fad4be; --cream:#fdf6ee; --text-dark:#3a3232; --text-mid:#6b5a5a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:var(--cream); color:var(--text-dark); font-family:'Nunito',sans-serif; }
    .lang-bar { display:flex; justify-content:center; gap:6px; padding:10px 16px; flex-wrap:wrap; }
    .lang-btn { border:2px solid var(--accent-light); background:rgba(255,255,255,.92); border-radius:50px; padding:4px 9px; color:var(--text-mid); cursor:pointer; font:800 .72rem 'Nunito',sans-serif; }
    .lang-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .top-bar { display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; padding:16px 20px; background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,black)); box-shadow:0 2px 12px rgba(0,0,0,.15); }
    .back-btn { display:flex; align-items:center; justify-content:center; flex-shrink:0; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.25); color:#fff; text-decoration:none; font-size:1.2rem; }
    .top-emoji { font-size:1.8rem; }
    .top-title { flex:1; color:#fff; font:1.3rem 'Pacifico',cursive; text-shadow:1px 2px 4px rgba(0,0,0,.2); }
    .content { max-width:600px; margin:0 auto; padding:20px 16px 40px; }
    .info-card { margin:18px 0; padding:16px 18px; border-radius:14px; background:#fff; box-shadow:0 2px 12px rgba(120,80,60,.08); color:var(--text-mid); font-size:.9rem; line-height:1.7; }
    .info-card h3 { margin-bottom:8px; color:var(--accent); font-size:.95rem; font-weight:900; }
    .guide { display:block; width:100%; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.12); }
    .back-footer { margin-top:28px; padding-bottom:20px; text-align:center; }
    .back-footer a { display:inline-flex; padding:12px 28px; border-radius:50px; background:var(--accent); color:#fff; text-decoration:none; box-shadow:0 4px 12px rgba(0,0,0,.2); font-size:.9rem; font-weight:800; }
  </style>
</head>
<body>
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('en',this)">EN</button><button class="lang-btn" onclick="setLang('ja',this)">JA</button><button class="lang-btn" onclick="setLang('zh',this)">ZH</button><button class="lang-btn" onclick="setLang('ko',this)">KO</button><button class="lang-btn" onclick="setLang('fr',this)">FR</button><button class="lang-btn" onclick="setLang('es',this)">ES</button>
  </div>
  <div class="top-bar"><a href="../" class="back-btn" aria-label="Back">←</a><span class="top-emoji">🛒</span><div class="top-title" data-i18n="pageTitle">Nearby Shops</div></div>
  <main class="content">
    <div class="info-card"><h3 data-i18n="heading">Groceries & Convenience Stores</h3><p data-i18n="intro">There are grocery and convenience stores near the house. Scan the QR codes on the guide below for directions. Please check opening hours before you go.</p></div>
    <img class="guide" src="assets/grocery-and-convenience-map.webp" alt="Map of nearby grocery and convenience stores">
    <div class="back-footer"><a href="../" data-i18n="backToMenu">← Back to Menu</a></div>
  </main>
  <script>
    const S={en:{pageTitle:'Nearby Shops',heading:'Groceries & Convenience Stores',intro:'There are grocery and convenience stores near the house. Scan the QR codes on the guide below for directions. Please check opening hours before you go.',backToMenu:'← Back to Menu'},ja:{pageTitle:'近隣のお店',heading:'食料品店・コンビニエンスストア',intro:'お部屋の近くに食料品店とコンビニがあります。下の案内にあるQRコードから行き方を確認できます。営業時間は事前にご確認ください。',backToMenu:'← メニューへ戻る'},zh:{pageTitle:'附近商店',heading:'食品店和便利店',intro:'房源附近有食品店和便利店。您可以扫描下方指南中的二维码查看路线。出发前请确认营业时间。',backToMenu:'← 返回菜单'},ko:{pageTitle:'주변 상점',heading:'식료품점과 편의점',intro:'숙소 근처에 식료품점과 편의점이 있습니다. 아래 안내의 QR 코드로 길을 확인할 수 있습니다. 방문 전 영업시간을 확인해 주세요.',backToMenu:'← 메뉴로 돌아가기'},fr:{pageTitle:'Commerces a proximite',heading:'Epiceries et commerces de proximite',intro:'Des epiceries et commerces de proximite se trouvent pres du logement. Scannez les codes QR du guide ci-dessous pour obtenir l itineraire. Verifiez les horaires avant de vous y rendre.',backToMenu:'← Retour au menu'},es:{pageTitle:'Tiendas cercanas',heading:'Supermercados y tiendas de conveniencia',intro:'Hay supermercados y tiendas de conveniencia cerca del alojamiento. Escanee los codigos QR de la guia para ver como llegar. Compruebe el horario antes de ir.',backToMenu:'← Volver al menu'}};
    function setLang(lang,button){document.querySelectorAll('.lang-btn').forEach((item)=>item.classList.remove('active'));button.classList.add('active');document.querySelectorAll('[data-i18n]').forEach((item)=>{item.textContent=S[lang][item.dataset.i18n];});}
  </script>
  <script src="../assets/cute-pack.js" defer></script>
</body>
</html>
